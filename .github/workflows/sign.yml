name: sign-run
# 签到独立产品跑批（薄壳 follower）：
#   - 代码不进本仓：运行时 checkout public 的 xm921016/cron-relay 取 signin.py，
#     改签到口径只改主仓一处（铁律：follower 不放代码）。
#   - 号单实时从 worker /api/sign/assign 领，本仓零 CK 零号数据，SIGN_PASS 走 Secret。
#   - 2026-11-24 起动态派片（按买家数伸缩）：CF worker（cron-relay，dispatchSignBatch）
#     北京 00:40 查 sign_users active 数 → 片数=ceil(active/350)（上限 12）→ 逐片
#     workflow_dispatch 本 workflow（inputs i/n）。本仓 schedule 已删（防双跑，CF 唯一发令）；
#     350/片 × 35s ≈ 3.5h，稳在单 job 300min 超时内，assign 每片 LIMIT 600 不会被触及。
on:
  workflow_dispatch:
    inputs:
      i:
        description: "分片序号（0 起）"
        required: false
        default: "0"
      n:
        description: "总分片数"
        required: false
        default: "1"

concurrency:
  # 按片序号分组：n 片并行各跑各的（原固定 group=sign-run 会让多片串行排队，
  # 8 片 × 3.5h 排不完直接超时）。schedule 已删，dispatch 必带 i；兜底值防手滑。
  group: sign-run-${{ github.event.inputs.i || github.run_id }}
  cancel-in-progress: false

jobs:
  sign:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout signin source (public master repo)
        uses: actions/checkout@v4
        with:
          repository: xm921016/cron-relay
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install requests pycryptodome
      - name: Run sign batch
        env:
          WORKER_URL: "https://xx1031.xyz"
          SIGN_USERS: "1"
          SIGN_PASS: ${{ secrets.SIGN_PASS }}
          SIGN_I: ${{ github.event.inputs.i || '0' }}
          SIGN_N: ${{ github.event.inputs.n || '1' }}
        run: python signin.py
