name: sign-run
# 签到独立产品跑批（薄壳 follower）：
#   - 代码不进本仓：运行时 checkout public 的 xm921016/cron-relay 取 signin.py，
#     改签到口径只改主仓一处（铁律：follower 不放代码）。
#   - 号单实时从 worker /api/sign/assign 领，本仓零 CK 零号数据，SIGN_PASS 走 Secret。
#   - 分片：dispatch 可传 i/n；买家规模 >250 前固定单片（i=0 n=1）。
#   - schedule 暂放本仓（单片无 fanout 无重复风险）；将来 016 接管 dispatch 派片时
#     必须删掉本 schedule，改由 master 统一派（防双跑）。
on:
  workflow_dispatch:
    inputs:
      i:
        description: "分片序号（0 起）"
        required: false
        default: "0"
      n:
        description: "总分片数"
        required: false
        default: "1"
  schedule:
    - cron: "40 16 * * *"   # 北京 00:40（错开 relay 00:20 高峰）

concurrency:
  group: sign-run
  cancel-in-progress: false

jobs:
  sign:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout signin source (public master repo)
        uses: actions/checkout@v4
        with:
          repository: xm921016/cron-relay
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install requests pycryptodome
      - name: Run sign batch
        env:
          WORKER_URL: "https://xx1031.xyz"
          SIGN_USERS: "1"
          SIGN_PASS: ${{ secrets.SIGN_PASS }}
          SIGN_I: ${{ github.event.inputs.i || '0' }}
          SIGN_N: ${{ github.event.inputs.n || '1' }}
        run: python signin.py
